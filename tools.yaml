# Integrity pins for the factory's host-side trusted tools (agents-7bj).
#
# A trusted tool (bwrap, gh, bd, git, semgrep, gitleaks, node, npm, npx, and the engine
# binaries pi, claude, agentapi; deepseek has no CLI binary, agents-mhv7) is resolved by
# lib/tool_pins.resolve_tool(): the configured `path` (if set) is preferred, otherwise it is
# found by name across PATH, and its SHA-256 is verified against `sha256`. A mismatch fails
# the run closed — the factory refuses to execute an unverified binary. bwrap heads the
# list because it delivers the OS sandbox itself: an unpinned or mismatched bwrap makes the
# host read as unable to sandbox (agents-28nn).
#
#   path:   (optional) absolute path the tool MUST resolve to.
#   sha256: (REQUIRED) 64-hex SHA-256 the resolved binary MUST hash to (this IS the
#           content/version pin — a rebuilt or swapped binary changes the hash).
#
# FAIL CLOSED: a trusted tool with no `sha256` is refused (no silent PATH fallback). `path`
# without a matching `sha256` is a config error (a symlink could redirect it). The only
# exception is the explicit dev/test opt-in FACTORY_ALLOW_UNPINNED_TOOLS=1, never the default.
#
# OUT-OF-BAND HOST PINS (agents-3g6): binary hashes are host-specific, so this repo file
# ships the format with pins commented out. A deployer points FACTORY_TOOL_PINS at a
# host-local file (e.g. /etc/factory/tools.pins.yaml or $HOME/.config/factory/tools.pins.yaml)
# that is merged OVER this file (host wins per tool). Generate it with:
#
#   tools/generate-tool-pins.sh            # writes $HOME/.config/factory/tools.pins.yaml
#   export FACTORY_TOOL_PINS="$HOME/.config/factory/tools.pins.yaml"
#
# Generate a single pin by hand with:  sha256sum "$(command -v gh)"
bwrap:
  # path: /usr/bin/bwrap
  # sha256: <64 hex>
gh:
  # path: /usr/local/bin/gh
  # sha256: <64 hex>
bd:
  # path: /usr/local/bin/bd
  # sha256: <64 hex>
git:
  # path: /usr/bin/git
  # sha256: <64 hex>
semgrep:
  # path: /usr/local/bin/semgrep
  # sha256: <64 hex>
gitleaks:
  # path: /usr/local/bin/gitleaks
  # sha256: <64 hex>
node:
  # path: /usr/bin/node
  # sha256: <64 hex>
npm:
  # path: /usr/bin/npm
  # sha256: <64 hex>
npx:
  # path: /usr/bin/npx
  # sha256: <64 hex>
# The engine binaries the adapters execute (agents-28nn round 5, review P0): the adapter is
# the LAST GRANTER BEFORE THE KEY — it hands the run's model credentials to whatever binary
# it execs, so an unpinned engine is an exfiltration path, not merely an unverified binary.
# Engines usually install OUTSIDE the system dirs (e.g. ~/.local/pi), so the generator only
# finds them when their directory is passed explicitly via --lookup-path.
pi:
  # path: /home/operator/.local/bin/pi
  # sha256: <64 hex>
claude:
  # path: /usr/local/bin/claude
  # sha256: <64 hex>
agentapi:
  # path: /usr/local/bin/agentapi
  # sha256: <64 hex>
