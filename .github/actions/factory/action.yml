name: 'The Software Factory Runner'
description: 'Runs portable Software Factory SDLC agents (secret-scan, issue-triage, deps-supply-chain, docs-drift, bundle-size, etc.) in GitHub Actions'
author: 'Paul Kinlan'

inputs:
  agent:
    description: 'Name of the factory agent to execute (e.g. secret-scan, issue-triage, deps-supply-chain, docs-drift, bundle-size)'
    required: true
  target:
    description: 'Path to target repository directory (defaults to current workspace)'
    required: false
    default: '.'
  engine:
    description: 'Engine adapter to run (auto, pi, claude, antigravity)'
    required: false
    default: 'auto'
  sink:
    description: 'Findings sink override (file, github-issues, beads)'
    required: false
    default: 'file'
  github_token:
    description: 'GitHub token for issue/PR management or repo reading'
    required: false
    default: ''
  model_api_key:
    description: 'API key for model inference (GEMINI_API_KEY or ANTHROPIC_API_KEY)'
    required: false
    default: ''
  factory_ref:
    description: >-
      Full 40-character commit SHA of the Software Factory to fetch when this action runs
      without the repository next to it (vendored use). Pinning is deliberate: bump it when
      the factory payload should move.
    required: false
    default: '35ae9c5a428fbcab2c5bf3e1c2ced586db844f6c'

outputs:
  status:
    description: 'Run status (success, failure, or andon-halt)'
    value: ${{ steps.run-agent.outputs.status }}
  new_findings:
    description: 'Count of net-new findings discovered'
    value: ${{ steps.run-agent.outputs.new_findings }}
  delta_report:
    description: 'Path to generated markdown delta report'
    value: ${{ steps.run-agent.outputs.delta_report }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Fetch Pinned Factory Repository
      shell: bash
      env:
        # Fetching is not a credentialed operation. Step env overrides anything the caller's
        # job set, so no token or model key is present while third-party code is fetched.
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
        GEMINI_API_KEY: ''
        ANTHROPIC_API_KEY: ''
        GIT_TERMINAL_PROMPT: '0'
        FACTORY_REF: ${{ inputs.factory_ref }}
      run: |
        set -euo pipefail
        if [ -f "$GITHUB_ACTION_PATH/../../factory" ]; then
          echo "FACTORY_DIR=$(cd "$GITHUB_ACTION_PATH/../.." && pwd)" >> "$GITHUB_ENV"
        else
          bash "$GITHUB_ACTION_PATH/fetch_factory.sh" "$RUNNER_TEMP/software-factory"
          echo "FACTORY_DIR=$RUNNER_TEMP/software-factory" >> "$GITHUB_ENV"
        fi

    - name: Execute Factory Agent
      id: run-agent
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        GEMINI_API_KEY: ${{ inputs.model_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.model_api_key }}
      run: |
        TARGET_PATH="${{ inputs.target }}"
        AGENT_NAME="${{ inputs.agent }}"
        ENGINE_ARG="${{ inputs.engine }}"
        SINK_ARG="${{ inputs.sink }}"
        
        echo "::group::Executing Factory Agent: $AGENT_NAME"
        echo "Target directory: $TARGET_PATH"
        echo "Engine: $ENGINE_ARG"
        echo "Sink: $SINK_ARG"

        python3 "$FACTORY_DIR/factory" run "$AGENT_NAME" \
          --target "$TARGET_PATH" \
          --engine "$ENGINE_ARG" \
          --sink "$SINK_ARG"
        
        TARGET_NAME=$(basename "$(cd "$TARGET_PATH" && pwd)")
        REPORT_FILE="$FACTORY_DIR/findings/${TARGET_NAME}-latest.md"
        
        # The report is safe to publish: lib/findings.py renders it through
        # lib/redaction.py, which masks credential-shaped text and drops secret-scan
        # snippets entirely. Never append a raw artifact (runs/*.json) to the step
        # summary — those files hold the matched values on purpose.
        if [ -f "$REPORT_FILE" ]; then
          echo "delta_report=$REPORT_FILE" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          cat "$REPORT_FILE" >> $GITHUB_STEP_SUMMARY
        else
          echo "status=success" >> $GITHUB_OUTPUT
        fi
        echo "::endgroup::"
