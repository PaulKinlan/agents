name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history is required: the freshness step runs tools/gen_site.py, which verifies
          # the pinned composite-action commit with `git cat-file -e <pin>^{commit}`. The default
          # depth-1 checkout does not contain that object (the pin is several commits behind
          # main), so the freshness step would fail on every push. (agents-36z + agents-6db;
          # ci.yml already checks out with full history for the same reason.)
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      # gen_site.py resolves git through the factory's fail-closed pin rule (agents-28nn
      # round 2), so the runner's pins must exist first — same step the composite action
      # runs. The generator never trusts the inherited PATH (a $GITHUB_PATH-planted
      # binary would otherwise be hashed and ACCEPTED as the valid pin).
      - name: Generate Tool Pins
        run: |
          set -euo pipefail
          tools/generate-tool-pins.sh "$RUNNER_TEMP/tools.pins.yaml"

      - name: Verify generated site is fresh
        run: |
          # agents-oq3j: the pins file is passed EXPLICITLY, never exported through $GITHUB_ENV.
          # That channel is inherited by every later step of the job, so a name in it cannot
          # establish that this step chose the file - only this argument does. The generate step
          # above is the producer, this is its consumer, and that ordering is the file's own.
          python3 tools/gen_site.py --tool-pins "$RUNNER_TEMP/tools.pins.yaml"
          if ! git diff --exit-code; then
            echo "Error: Generated docs are stale or uncommitted. Run 'python3 tools/gen_site.py' locally and commit the changes." >&2
            exit 1
          fi

      # docs/ is a working directory: it also holds PLAN.md, DESIGN.md,
      # INTEGRATION.md and internal audits. Publish only the reachable site, so
      # nothing else in docs/ (now or later) can be served (agents-36z).
      - name: Stage the published site
        run: python3 tools/stage_site.py --source docs --out _site

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
