name: Software Factory CI

on:
  push:
    branches: [main]
  # every PR, including stacked PRs whose base is another branch (they got no checks before)
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  self-audit:
    name: Factory Self-Audit
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19
    steps:
      - name: Checkout repository
        # Pinned to the commit its v7 tag points at (verified via git ls-remote, 2026-11-02).
        # Mutable tags are supply-chain exposure: a compromised action repo would flow straight
        # into this highest-privilege workflow (same audit class as agents-dikvi/pages.yml).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Verify Factory CLI & List Agents
        run: |
          chmod +x ./factory
          ./factory list

      - name: Run Core Unit Tests
        run: |
          bash tools/full-gate.sh

      # Even on a laptop where bubblewrap works, exercise the GitHub runner's
      # no-sandbox condition: successful engine runs must skip, but pi must still
      # REFUSE an unsandboxed run. No opt-in is set for this public repository.
      - name: Guard no-bubblewrap CI parity
        run: python3 -m unittest discover -s tests -t . -p 'test_no_bwrap_guard.py' -v

      - name: Prepare run artifacts directory
        run: mkdir -p runs

      - name: Run Secret Scan Pre-pass
        run: |
          python3 agents/secret-scan/scripts/scan.py --target . --output runs/ci-secrets.json
          # Never `cat` this report: secret-scan candidates carry the matched credential in
          # `snippet` / `raw_match`, and workflow logs are public on a public repository.
          python3 lib/candidate_summary.py runs/ci-secrets.json

      - name: Run Docs Drift Pre-pass
        run: |
          python3 agents/docs-drift/scripts/check_docs.py --target . --output runs/ci-docs-drift.json
          python3 lib/candidate_summary.py runs/ci-docs-drift.json

      - name: Run Dependency Audit Pre-pass
        run: |
          python3 agents/deps-supply-chain/scripts/audit_deps.py --target . --output runs/ci-deps.json
          python3 lib/candidate_summary.py runs/ci-deps.json
