# The factory gate's command configuration - TRACKED, so it survives a rebuild.
#
# *** THIS FILE IS NOT READ BY THE DEPLOYED GATE BY ITSELF. ***
# ~/fleet/bin/fleet-check sources ${FLEET_CHECK_CONF:-$HOME/.fleet/check.conf} (fleet-5h8w), and auto-detects a
# command it can actually run - deno.json WITH .tasks.check, or package.json WITH .scripts.test
# (:156-159), exiting 2 when NEITHER PREDICATE matches (:160, not merely when neither file
# exists: agents-3q1e). THIS REPO IS THE SECOND PREDICATE FAILING - package.json exists at the
# root but declares no scripts.test (measured 2026-10-12, `jq -e '.scripts.test' package.json`
# -> rc=1), which is why the commands below reach the gate only after the install step:
# IT DOES NOT READ THIS FILE. The commands below reach the gate ON MACHINES WHERE THIS
# PROJECT'S DEPLOYMENT STEP HAS RUN:
#     bash tools/check-cmd.sh --install --global      (the host-wide file the deployed gate reads by default)
# and ONLY there. Being tracked makes this file REVIEWABLE and DURABLE; it does not make it
# AUTHORITATIVE, and the assumption that a tracked config is read by virtue of being
# tracked is the very mistake this bead started from.
# The correct end state - fleet-check learning a project-local lookup - is a fleet-bundle
# change and is with the hub. Until then, the claim is the weaker one above.
#
# WHY THIS FILE EXISTS (agents-ia3p, P1): the hermeticity fix for the full test suite -
# the `-t .` that makes `python3 -m unittest discover` import `tests/__init__.py` and
# therefore run the hermetic declaration - lived ONLY in an untracked per-VM
# ~/.fleet/check.conf, while .github/workflows/ci.yml, WHICH IS VERSION-CONTROLLED AND IS
# THE DEPLOYED INVOCATION, still ran package-blind discovery. The file that survived a
# rebuild had the defect; the file that did not had the fix. And it was already written
# down: docs/proposals/hermetic-test-environment-declaration.md:60 describes this exact
# defect and :64 gives the corrected command. THE KNOWLEDGE WAS TRACKED AND THE BEHAVIOUR
# WAS NOT, so a document told us the right answer while the system ran a different one.
#
# HOW IT IS READ: tools/check-cmd.sh reads this file and writes its values into the file it is POINTED AT.
# agents-0utp: since the install destination was fixed there are three of those and THE DEFAULT IS
# REPO-LOCAL - a bare `bash tools/check-cmd.sh --install` writes $HOME/.fleet/<repo>-check.conf, which the
# deployed gate reads only when FLEET_CHECK_CONF names it, and which cannot disturb any other repo on this
# host. That default is why the line above names --global: the host-wide ~/.fleet/check.conf, which
# ~/fleet/bin/fleet-check reads BY DEFAULT for every repo invoked on this host, is written only when an
# installer asks for it (install.sh does). FLEET_CHECK_CONF=<path> --install writes that path and wins over
# --global. The deployed ~/fleet/bin/fleet-check reads ${FLEET_CHECK_CONF:-$HOME/.fleet/check.conf},
# executing CHECK_CMD for the full gate and CHECK_FAST_CMD (which runs tools/fast-gate.sh) for the fast
# gate. To update or tune gate commands, edit this tracked file and re-run the install command that writes
# the file you mean.
#
# SOURCING IS DELIBERATELY STRICT: this file is shell, it is sourced, and a syntax error
# is fatal under the caller's `set -e`. The gate then REFUSES TO RUN rather than falling
# back to a default - a gate that silently substitutes a command nobody chose reports a
# verdict about the wrong thing, which is worse than reporting none.
#
# ONE COMMAND PER LINE, AS A SINGLE STRING: the full-gate entrypoint owns its tee/pipefail
# summary writer and module-granular runner, so CI and the merger invoke the same mechanism.
# The runner uses unittest's package-aware discovery (-s tests, -t . via TestLoader) before
# sharding; importing tests/__init__.py declares the hermetic environment. Its summary name
# carries tree+lane+sha+UTC stamp+pid, and tee -a preserves the identity header.
CHECK_CMD="bash tools/full-gate.sh"

# The fast gate: the project's changed/affected-test command.
CHECK_FAST_CMD="bash tools/fast-gate.sh"

# Bounds, in seconds. The full gate is heavy; keep it generous.
CHECK_TIMEOUT=2400
CHECK_FAST_TIMEOUT=180
