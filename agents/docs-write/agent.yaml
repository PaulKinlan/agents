name: docs-write
class: proposer
plane: [ci, local]
containment: t2-local
triggers: [repo-event, schedule, manual]
blocking: false
short_circuit_empty: false
summary: Companion to docs-drift that synthesizes concrete markdown patches and PR updates to fix stale documentation and undocumented modules.
capabilities:
  write: true
  network: false
  browser: false
  requires: [git]
budget:
  max_minutes: 10
output:
  schema: report.schema.json
