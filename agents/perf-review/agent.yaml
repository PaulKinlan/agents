name: perf-review
class: proposer
plane: [ci, local]
containment: t2-local
triggers: [repo-event, manual, schedule]
blocking: false
short_circuit_empty: false
summary: Inspect recent git commits and diffs for performance anti-patterns (LCP, INP, CLS, layout thrashing, waterfalls) and propose concrete code fixes.
capabilities:
  write: true
  network: false
  browser: false
  requires: [git]
budget:
  max_minutes: 10
output:
  schema: report.schema.json
  # rn0ky: a single call carrying 47 candidates produced a 50 KB completion cut mid-JSON at candidate
  # 45, which the parser could only report as "no verdict". Eight candidates per call keeps every
  # response small enough to finish, and each batch is validated and retried on its own.
  max_candidates_per_call: 8
