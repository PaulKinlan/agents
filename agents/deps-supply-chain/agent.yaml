name: deps-supply-chain
class: observer
plane: [both]
containment: t1-fetch
triggers: [schedule, manual, repo-event]
blocking: false
short_circuit_empty: true
summary: Audit dependency vulnerabilities, assess exploitability and reachability, and detect supply chain risks.
capabilities:
  write: false
  network: true
  browser: false
  # agents-2x6: the pre-pass runs `npm audit`, so its egress (registry.npmjs.org) is
  # derived from this declaration — the egress-allowlist proxy allows exactly these hosts.
  requires: [npm]
budget:
  max_minutes: 5
output:
  schema: report.schema.json
