name: modern-web
class: proposer
plane: [local, ci]
containment: t0-readonly
triggers: [manual, schedule, repo-event]
blocking: false
short_circuit_empty: true
summary: Audit HTML, CSS, and JS against Modern Web Guidance to replace legacy workarounds with native Baseline Web APIs.
capabilities:
  write: false
  network: false
  browser: false
  requires: []
budget:
  # Per engine call: 50 candidates make seven 8-candidate batches. Seven 10-minute
  # calls exceed the dispatcher's 45-minute station ceiling and get only ~381s each.
  # Seven 5-minute calls fit, leaving the declared allowance intact.
  max_minutes: 5
output:
  schema: report.schema.json
