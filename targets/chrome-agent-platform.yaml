name: chrome-agent-platform
path: ~/Code/chrome-agent-platform
sink: beads
visibility: public
agents:
  - secret-scan
  - threat-model
  - vuln-discovery
  - vuln-verify
  - vuln-triage
  - issue-triage
  - deps-supply-chain
  - modern-web
  - ui-ux-audit
  - resilience
  - perf-review
  - perf-hillclimb
  - memory-profile
  - bundle-size
  - docs-drift
  - docs-write
  - pr-fixer
schedule:
  secret-scan:
    hour: 7
    minute: 30
  deps-supply-chain:
    hour: 7
    minute: 35
  docs-drift:
    hour: 7
    minute: 40
